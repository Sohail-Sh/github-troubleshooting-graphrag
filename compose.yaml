services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      FASTEMBED_CACHE_PATH: /app/data/models
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results

volumes:
  neo4j-data:
